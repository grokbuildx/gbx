name: Release and Publish

on:
  push:
    tags:
      - 'v*'
    # Tag-scoped caches are unavailable to later tags. Warm reusable target
    # caches on main when dependencies/build settings change.
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - scripts/build-release.sh
      - scripts/build-grok.sh
      - third_party/grok-build/REVISION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo 'version=dev' >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Release tags must use vMAJOR.MINOR.PATCH (or legacy vMAJOR.MINOR.PATCH.BUILD): $TAG_NAME"
            exit 1
          fi

  verify:
    name: Verify release
    if: github.ref_type == 'tag'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, build-grok]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: gbx-darwin-amd64
            grok: grok-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: gbx-darwin-arm64
            grok: grok-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: gbx-linux-amd64
            grok: grok-linux-amd64
          - goos: linux
            goarch: arm64
            asset: gbx-linux-arm64
            grok: grok-linux-arm64
          - goos: windows
            goarch: amd64
            asset: gbx-win32-x64.exe
          - goos: windows
            goarch: arm64
            asset: gbx-win32-arm64.exe
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache target dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gbx-release-v3-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'scripts/build-release.sh') }}
          restore-keys: |
            gbx-release-v3-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.go.outputs.go-version }}-
      - name: Download Grok Build pin
        if: matrix.grok
        uses: actions/download-artifact@v8
        with:
          name: pin-${{ matrix.grok }}
          path: grok
      - name: Read Grok Build pin
        if: matrix.grok
        run: |
          echo "GROK_SHA256=$(tr -d '[:space:]' < 'grok/${{ matrix.grok }}.gz.sha256')" >> "$GITHUB_ENV"
          echo "GROK_VERSION=$(tr -d '[:space:]' < 'grok/${{ matrix.grok }}.version')" >> "$GITHUB_ENV"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OUTPUT: dist/${{ matrix.asset }}
          # Public Desktop OAuth client for Google Drive cloud sync; release
          # binaries carry no built-in client, so both are required.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [[ -z "$GOOGLE_OAUTH_CLIENT_ID" || -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]]; then
            echo "GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET secrets are required" >&2
            exit 1
          fi
          bash scripts/build-release.sh
      # GitHub releases ship each binary gzip-compressed (~28 MB -> ~10 MB);
      # `gbx update` downloads <asset>.gz. -n drops the name and timestamp so
      # the archive depends only on the binary.
      - name: Compress binary
        if: github.ref_type == 'tag'
        run: gzip -9 -n "dist/${{ matrix.asset }}"
      - name: Upload binary
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # Grok Build is compiled from the open-source xai-org/grok-build commit
  # pinned in third_party/grok-build/REVISION, on native runners because it
  # links platform C libraries. Each commit is published once, as the release
  # grok-build-<commit>; later releases that keep the commit reuse it without
  # rebuilding, and gbx downloads it only when the pinned commit changes.
  # Windows is not a supported upstream build host, so Windows gbx uses a
  # system Grok Build.
  build-grok:
    name: Grok Build ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: grok-darwin-amd64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: grok-darwin-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: grok-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: grok-linux-arm64
    steps:
      - uses: actions/checkout@v5
      - name: Check for a published build of the pinned commit
        id: pin
        run: |
          revision="$(tr -d '[:space:]' < third_party/grok-build/REVISION)"
          tag="grok-build-${revision:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if gh release download "$tag" -R "$GITHUB_REPOSITORY" -D dist \
              -p '${{ matrix.asset }}.gz.sha256' -p '${{ matrix.asset }}.version' 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${{ matrix.asset }} from release $tag"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        if: steps.pin.outputs.published != 'true'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends protobuf-compiler pkg-config libssl-dev libasound2-dev libwayland-dev libxkbcommon-dev cmake clang
          else
            brew install protobuf
          fi
      - name: Cache Cargo
        if: steps.pin.outputs.published != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .grok-build-src/target
          key: grok-build-${{ matrix.target }}-${{ hashFiles('third_party/grok-build/REVISION') }}
          restore-keys: |
            grok-build-${{ matrix.target }}-
      - name: Build Grok Build
        if: steps.pin.outputs.published != 'true'
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT: dist/${{ matrix.asset }}
          NOTICES_DIR: dist/notices
        run: bash scripts/build-grok.sh
      - name: Smoke test
        if: steps.pin.outputs.published != 'true' && matrix.target != 'x86_64-apple-darwin'
        run: dist/${{ matrix.asset }} --version
      - name: Publish to the grok-build release
        if: steps.pin.outputs.published != 'true' && github.ref_type == 'tag'
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          revision="$(tr -d '[:space:]' < third_party/grok-build/REVISION)"
          # The four platform jobs race to create the release; losing is fine.
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Grok Build $(cat 'dist/${{ matrix.asset }}.version') (open source, $TAG)" \
            --notes "Grok Build compiled without modification from https://github.com/xai-org/grok-build/tree/$revision (Apache-2.0). gbx downloads these archives and verifies them against the SHA-256 compiled into gbx." 2>/dev/null \
            || gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null
          files=(dist/${{ matrix.asset }}.gz dist/${{ matrix.asset }}.gz.sha256 dist/${{ matrix.asset }}.version)
          if [[ "${{ matrix.asset }}" == grok-linux-amd64 ]]; then
            cp dist/notices/GROK_BUILD_THIRD_PARTY_NOTICES dist/GROK_BUILD_THIRD_PARTY_NOTICES
            cp third_party/grok-build/LICENSE dist/GROK_BUILD_LICENSE
            files+=(dist/GROK_BUILD_THIRD_PARTY_NOTICES dist/GROK_BUILD_LICENSE)
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
      - name: Upload pin for the gbx build
        uses: actions/upload-artifact@v7
        with:
          name: pin-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.gz.sha256
            dist/${{ matrix.asset }}.version
          if-no-files-found: error
          retention-days: 3

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [prepare, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: gbx-*
          path: dist
          merge-multiple: true
      - name: Verify asset set and create checksums
        run: |
          for asset in gbx-darwin-amd64 gbx-darwin-arm64 gbx-linux-amd64 gbx-linux-arm64 gbx-win32-x64.exe gbx-win32-arm64.exe; do
            gzip -t "dist/$asset.gz"
          done
          (cd dist && sha256sum gbx-*.gz > SHA256SUMS)
          ls -lh dist
      # gh uploads the assets concurrently (softprops uploaded them one at a
      # time). With assets it creates a draft, uploads, then publishes, so a
      # failed upload never leaves a half-populated release.
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          assets=(dist/* THIRD_PARTY_NOTICES.md)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # A re-run: refresh the assets of the existing release.
            gh release upload "$VERSION" "${assets[@]}" --clobber
            exit 0
          fi
          notes=()
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            # Prepended to the generated notes, as softprops body_path did.
            notes=(--notes-file "docs/releases/$VERSION.md")
          fi
          gh release create "$VERSION" "${assets[@]}" --verify-tag --generate-notes "${notes[@]}"

  # Each platform package ships one native binary; npm installs only the
  # matching optional dependency. Until npm serves that package, postinstall
  # downloads the binary from the GitHub release, so it must exist first.
  npm:
    name: Publish npm
    if: github.ref_type == 'tag'
    needs: [prepare, verify, build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: gbx-*
          path: dist
          merge-multiple: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Prepare platform-specific npm packages
        env:
          TAG_NAME: ${{ needs.prepare.outputs.version }}
        run: node scripts/build-npm-packages.js "$TAG_NAME"
      - name: Verify npm packaging
        run: node --test scripts/npm-packages.test.js
      # NPM_TOKEN is a granular access token with read/write on the
      # @grokbuildx scope. id-token: write still lets npm attach provenance.
      - name: Publish platform packages and launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN secret is required to publish to npm" >&2
            exit 1
          fi
          node scripts/publish-npm-packages.js dist/npm
